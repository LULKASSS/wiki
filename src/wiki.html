<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Persönliches Wiki</title>
<meta name="theme-color" content="#f0f0f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141416" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wiki">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
html, body { margin: 0; background: var(--leinwand); color: var(--ink); }
body { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.marke { white-space: nowrap; flex-shrink: 0; }
@media (max-width: 820px) { .marke { font-size: 15px; } .suche { flex: 1 1 auto; } }

:root {
  color-scheme: light;
  --anzeige: "Geist", "IBM Plex Sans", system-ui, sans-serif;
  --text: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --leinwand: #f0f0f2;
  --panel: #ffffff;
  --panel2: #f5f5f8;
  --ink: #17171b;
  --ink2: #50505a;
  --grau: #6b6b74;
  --linie: #e4e4ea;
  --linie2: #ececf1;
  --akzent: #6a52a3;
  --akzent-weich: #efecf8;
  --akzent-text: #ffffff;
  --ocker: #985210;
  --ocker-weich: #fbeddd;
  --pille: #17171b;
  --pille-text: #ffffff;
  --schatten: 0 10px 26px -14px rgba(18,18,28,.22), 0 2px 5px -2px rgba(18,18,28,.05);
  /* Himmel */
  --h-oben: #e9e7f1;
  --h-unten: #f2f2f5;
  --h-stern: #2b2838;
  --h-linie: rgba(106,82,163,.42);
  --h-staub: rgba(60,50,90,.28);
  --h-schrift: #3a3648;
  --h-leise: rgba(58,54,72,.55);
  --r: 16px;
  --ease: cubic-bezier(.23, 1, .32, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --leinwand: #141416; --panel: #1c1c20; --panel2: #232328;
    --ink: #ededf1; --ink2: #b2b2ba; --grau: #8e8e97;
    --linie: #2f2f35; --linie2: #27272c;
    --akzent: #a48ddb; --akzent-weich: #2a2540; --akzent-text: #14141a;
    --ocker: #e0a469; --ocker-weich: #33281c;
    --pille: #ededf1; --pille-text: #141416;
    --schatten: 0 12px 28px -16px rgba(0,0,0,.7);
    --h-oben: #121116; --h-unten: #1a1920;
    --h-stern: #f1eefb; --h-linie: rgba(180,160,235,.40); --h-staub: rgba(220,210,255,.35);
    --h-schrift: #e8e4f6; --h-leise: rgba(232,228,246,.5);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --leinwand: #141416; --panel: #1c1c20; --panel2: #232328;
  --ink: #ededf1; --ink2: #b2b2ba; --grau: #8e8e97;
  --linie: #2f2f35; --linie2: #27272c;
  --akzent: #a48ddb; --akzent-weich: #2a2540; --akzent-text: #14141a;
  --ocker: #e0a469; --ocker-weich: #33281c;
  --pille: #ededf1; --pille-text: #141416;
  --schatten: 0 12px 28px -16px rgba(0,0,0,.7);
  --h-oben: #121116; --h-unten: #1a1920;
  --h-stern: #f1eefb; --h-linie: rgba(180,160,235,.40); --h-staub: rgba(220,210,255,.35);
  --h-schrift: #e8e4f6; --h-leise: rgba(232,228,246,.5);
}

*, *::before, *::after { box-sizing: border-box; }
:root { display: block; background: var(--leinwand); color: var(--ink); font-family: var(--text); font-size: 14.5px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--akzent); outline-offset: 2px; border-radius: 8px; }

.app { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 10px 64px;
  display: flex; flex-direction: column; gap: 12px; }

/* ---------- Kopf ---------- */
.kopf { display: flex; align-items: center; gap: 12px; min-height: 40px; }
.marke { display: flex; align-items: center; gap: 9px; background: none; border: 0; padding: 4px 6px 4px 2px;
  font-family: var(--anzeige); font-weight: 600; font-size: 16px; letter-spacing: -.01em; }
.marke svg { color: var(--akzent); }
.suche { margin-left: auto; position: relative; flex: 0 1 320px; min-width: 0; }
.suche input { width: 100%; height: 36px; border-radius: 99px; border: 1px solid var(--linie);
  background: var(--panel); color: var(--ink); padding: 0 14px 0 36px; font: inherit; font-size: 14px; }
.suche input:focus { outline: none; border-color: var(--akzent); }
.suche svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--grau); pointer-events: none; }
.suche kbd { position: absolute; right: 11px; top: 50%; transform: translateY(-50%); font: 500 11px var(--text);
  color: var(--grau); border: 1px solid var(--linie); border-radius: 5px; padding: 0 5px; pointer-events: none; }
.treffer { position: absolute; top: 42px; right: 0; left: 0; min-width: 300px; z-index: 30; background: var(--panel);
  border-radius: 14px; box-shadow: var(--schatten); border: 1px solid var(--linie); padding: 6px; max-height: 60vh; overflow: auto; }
.treffer button { display: flex; flex-direction: column; gap: 1px; width: 100%; text-align: left; background: none; border: 0;
  padding: 8px 10px; border-radius: 10px; }
.treffer button[aria-selected="true"], .treffer button:hover { background: var(--panel2); }
.treffer .t1 { font-weight: 500; }
.treffer .t2 { font-size: 12.5px; color: var(--grau); }
.treffer .leer { padding: 10px; color: var(--grau); font-size: 13px; }

/* ---------- Himmel ---------- */
.grund { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; pointer-events: none; }
.app { position: relative; z-index: 1; }
.himmel { position: relative; height: 270px; transition: height .55s var(--ease); cursor: default;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
.himmel[data-zeiger="ja"] { cursor: pointer; }
.app[data-tief="ja"] .himmel { height: 230px; }
.himmel-ort { position: absolute; left: 14px; bottom: 12px; display: flex; align-items: center; gap: 6px; max-width: calc(100% - 160px); white-space: nowrap; overflow: hidden;
  font-size: 12.5px; color: var(--h-schrift); pointer-events: none; }
.himmel-ort b { font-weight: 600; }
.himmel-ort .sep { opacity: .45; }
.himmel-knopf { position: absolute; right: 12px; bottom: 10px; height: 30px; padding: 0 12px; border-radius: 99px;
  border: 1px solid color-mix(in srgb, var(--h-schrift) 18%, transparent); background: color-mix(in srgb, var(--h-unten) 70%, transparent);
  color: var(--h-schrift); font-size: 12.5px; display: flex; align-items: center; gap: 6px; backdrop-filter: blur(6px);
  transition: opacity .25s var(--ease); }
.himmel-knopf[hidden] { display: none; }

/* ---------- Reiter ---------- */
.reiter { display: flex; gap: 4px; padding: 4px; background: var(--panel); border-radius: 99px; align-self: flex-start;
  box-shadow: var(--schatten); max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.reiter button { border: 0; background: none; height: 34px; padding: 0 16px; border-radius: 99px; color: var(--ink2);
  font-weight: 500; white-space: nowrap; display: flex; align-items: center; gap: 7px;
  transition: background .2s var(--ease), color .2s var(--ease); }
.reiter button .n { font-size: 12px; color: var(--grau); font-variant-numeric: tabular-nums; }
.reiter button[aria-selected="true"] { background: var(--pille); color: var(--pille-text); }
.reiter button[aria-selected="true"] .n { color: color-mix(in srgb, var(--pille-text) 60%, transparent); }

/* ---------- Körper ---------- */
.koerper { display: grid; grid-template-columns: 236px minmax(0, 1fr); gap: 14px; align-items: start; }
.kats { position: sticky; top: 12px; background: var(--panel); border-radius: var(--r); box-shadow: var(--schatten);
  padding: 8px; display: flex; flex-direction: column; gap: 2px; }
.kats .kopfzeile { font-size: 12px; color: var(--grau); padding: 6px 10px 4px; }
.kat { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0; background: none;
  padding: 8px 10px; border-radius: 11px; color: var(--ink2); }
.kat svg { flex-shrink: 0; color: var(--grau); }
.kat .name { flex: 1; min-width: 0; }
.kat .n { font-size: 12px; color: var(--grau); font-variant-numeric: tabular-nums; }
.kat[aria-current="true"] { background: var(--akzent-weich); color: var(--ink); font-weight: 500; }
.kat[aria-current="true"] svg { color: var(--akzent); }
.kats .leise { font-size: 12px; color: var(--grau); padding: 8px 10px 4px; line-height: 1.45; }

.inhalt { background: var(--panel); border-radius: var(--r); box-shadow: var(--schatten); padding: 28px 32px 30px; min-width: 0; }
.inhalt.ein { animation: ein .32s var(--ease); }
@keyframes ein { from { opacity: .35; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* ---------- Typo im Inhalt ---------- */
.krume { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 12.5px; color: var(--grau); margin-bottom: 10px; }
.krume button { border: 0; background: none; padding: 0; color: var(--grau); }
.krume button:hover { color: var(--akzent); }
h1 { font-family: var(--anzeige); font-weight: 600; font-size: 28px; line-height: 1.2; letter-spacing: -.02em; margin: 0;
  text-wrap: balance; }
h2 { font-family: var(--anzeige); font-weight: 600; font-size: 18px; letter-spacing: -.01em; margin: 0; text-wrap: balance; }
h3 { font-family: var(--anzeige); font-weight: 600; font-size: 15px; margin: 0; }
.lead { font-size: 16.5px; color: var(--ink2); margin: 8px 0 0; max-width: 62ch; line-height: 1.5; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 11px; border-radius: 99px;
  background: var(--panel2); border: 1px solid var(--linie2); font-size: 12.5px; color: var(--ink2); }
button.chip:hover { border-color: var(--akzent); color: var(--ink); }
.chip.werkzeug svg { color: var(--grau); }

.toc { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--linie2); }
.toc span { font-size: 12px; color: var(--grau); margin-right: 4px; align-self: center; }
.toc button { border: 0; background: none; padding: 3px 8px; border-radius: 8px; font-size: 13px; color: var(--ink2); }
.toc button:hover { background: var(--panel2); color: var(--ink); }

.abschnitt { margin-top: 26px; display: flex; flex-direction: column; gap: 10px; scroll-margin-top: 16px; }
.abschnitt .intro { margin: 0; color: var(--ink2); max-width: 64ch; }
ol.schritte { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0; counter-reset: s; max-width: 70ch; }
ol.schritte li { counter-increment: s; display: grid; grid-template-columns: 28px 1fr; gap: 10px; padding: 7px 0; position: relative; }
ol.schritte li::before { content: counter(s); width: 24px; height: 24px; border-radius: 50%; background: var(--akzent-weich);
  color: var(--akzent); font: 600 12px var(--anzeige); display: flex; align-items: center; justify-content: center;
  font-variant-numeric: tabular-nums; margin-top: 1px; }
ol.schritte li:not(:last-child)::after { content: ""; position: absolute; left: 11.5px; top: 33px; bottom: -3px; width: 1px; background: var(--linie); }
.achten { background: var(--panel2); border-radius: 14px; padding: 12px 16px; max-width: 70ch; }
.achten h3 { font-size: 13px; color: var(--grau); font-weight: 500; font-family: var(--text); margin-bottom: 4px; }
.achten ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 5px; }
.achten li::marker { color: var(--akzent); }
.unbest { display: inline-block; font-size: 11px; font-weight: 600; color: var(--ocker); background: var(--ocker-weich);
  border-radius: 99px; padding: 0 7px; margin-right: 6px; vertical-align: 1px; }

.block { margin-top: 30px; padding-top: 18px; border-top: 1px solid var(--linie2); display: flex; flex-direction: column; gap: 10px; }
.block > .kz { font-size: 12.5px; color: var(--grau); }
details.wkarte { border: 1px solid var(--linie); border-radius: 14px; background: var(--panel); overflow: hidden; }
details.wkarte summary { list-style: none; cursor: pointer; padding: 11px 14px; display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; }
details.wkarte summary::-webkit-details-marker { display: none; }
details.wkarte summary .t1 { font-weight: 500; }
details.wkarte summary .t2 { grid-column: 1; font-size: 13px; color: var(--grau); }
details.wkarte summary .pf { grid-row: 1 / span 2; grid-column: 2; align-self: center; color: var(--grau); transition: transform .25s var(--ease); }
details.wkarte[open] summary .pf { transform: rotate(90deg); }
details.wkarte .wk-inhalt { padding: 0 14px 14px; display: flex; flex-direction: column; gap: 10px; }
.punkte { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 5px; max-width: 70ch; }
.punkte li::marker { color: var(--akzent); }
.beleg { font-size: 12px; color: var(--grau); display: flex; flex-wrap: wrap; gap: 4px 12px; }
.textknopf { border: 0; background: none; padding: 0; color: var(--akzent); font-size: 13px; font-weight: 500; align-self: flex-start; }

.anlass-nav { display: flex; flex-direction: column; gap: 8px; }
.anlass-zeile { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: var(--panel2); border-radius: 12px; padding: 8px 10px 8px 14px; }
.anlass-zeile .was { flex: 1; min-width: 140px; font-size: 13.5px; }
.anlass-zeile .was b { font-weight: 600; }
.anlass-zeile .wo { color: var(--grau); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.blaettern { display: flex; gap: 6px; }
.blaettern button { height: 30px; padding: 0 11px; border-radius: 99px; border: 1px solid var(--linie); background: var(--panel);
  font-size: 12.5px; color: var(--ink2); max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.blaettern button:disabled { opacity: .35; cursor: default; }
.blaettern button:not(:disabled):hover { border-color: var(--akzent); color: var(--ink); }
.links { display: flex; flex-wrap: wrap; gap: 6px; }
.fuss { margin-top: 26px; font-size: 12px; color: var(--grau); display: flex; flex-wrap: wrap; gap: 4px 14px; }

/* ---------- Listen ---------- */
.liste { display: flex; flex-direction: column; margin-top: 16px; }
.eintrag { display: grid; grid-template-columns: 1fr auto; gap: 2px 14px; text-align: left; width: 100%; border: 0; background: none;
  padding: 13px 14px; border-radius: 12px; }
.eintrag + .eintrag { border-top: 1px solid var(--linie2); }
.eintrag:hover { background: var(--panel2); }
.eintrag:hover + .eintrag { border-top-color: transparent; }
.eintrag .t1 { font-weight: 500; }
.eintrag .t2 { grid-column: 1; font-size: 13px; color: var(--grau); }
.eintrag .rechts { grid-row: 1 / span 2; grid-column: 2; align-self: center; font-size: 12px; color: var(--grau); display: flex; gap: 10px; align-items: center; }
.gruppe { margin-top: 26px; }
.gruppe:first-of-type { margin-top: 18px; }
.gruppe h2 { display: flex; align-items: center; gap: 9px; }
.gruppe h2 svg { color: var(--akzent); }
.gruppe h2 button { border: 0; background: none; padding: 0; font: inherit; }
.gruppe h2 button:hover { color: var(--akzent); }
.gruppe .kurz { margin: 3px 0 0 27px; font-size: 13px; color: var(--grau); }
.gruppe .liste { margin-top: 6px; }

.anlaesse { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; margin-top: 14px; }
.anlass { text-align: left; border: 1px solid var(--linie); background: var(--panel); border-radius: 14px; padding: 14px 15px;
  display: flex; flex-direction: column; gap: 8px; transition: border-color .2s var(--ease); }
.anlass:hover { border-color: var(--akzent); }
.anlass .t1 { font-family: var(--anzeige); font-weight: 600; font-size: 15px; }
.anlass .t2 { font-size: 13px; color: var(--grau); }
.anlass .weg { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font-size: 12px; color: var(--ink2); }
.anlass .weg i { font-style: normal; color: var(--grau); }
.zahlen { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 10px; font-size: 13px; color: var(--grau); }
.zahlen b { color: var(--ink); font-family: var(--anzeige); font-weight: 600; font-variant-numeric: tabular-nums; }
.hinweisbox { margin-top: 26px; border: 1px dashed var(--linie); border-radius: 14px; padding: 12px 15px; font-size: 13px; color: var(--grau); }

/* ---------- Schmal ---------- */
@media (max-width: 820px) {
  .koerper { grid-template-columns: minmax(0, 1fr); }
  .kats { position: static; flex-direction: row; overflow-x: auto; scrollbar-width: none; padding: 5px; border-radius: 99px; gap: 2px; }
  .kats .kopfzeile, .kats .leise { display: none; }
  .kat { width: auto; white-space: nowrap; border-radius: 99px; padding: 7px 12px; }
  .kat .n { display: none; }
  .inhalt { padding: 20px 18px 22px; }
  h1 { font-size: 23px; }
  .lead { font-size: 15px; }
  .himmel { height: 230px; }
  .app[data-tief="ja"] .himmel { height: 200px; }
  .himmel-ort { display: none; }
  .suche { flex-basis: 180px; }
  .suche kbd { display: none; }
  .reiter { align-self: stretch; }
  .reiter button { flex: 1; justify-content: center; padding: 0 10px; }
  .reiter button .n { display: none; }
  .treffer { left: auto; width: min(92vw, 360px); }
}

/* ---------- Pfad (Anlass) ---------- */
ol.pfad { list-style: none; margin: 18px 0 0; padding: 0; display: flex; flex-direction: column; counter-reset: p; }
ol.pfad li { counter-increment: p; display: grid; grid-template-columns: 30px 1fr; gap: 8px; position: relative; }
ol.pfad li::before { content: counter(p); width: 26px; height: 26px; margin-top: 12px; border-radius: 50%; background: var(--akzent-weich);
  color: var(--akzent); font: 600 12px var(--anzeige); display: flex; align-items: center; justify-content: center; }
ol.pfad li:not(:last-child)::after { content: ""; position: absolute; left: 12.5px; top: 42px; bottom: -8px; width: 1px; background: var(--linie); }
ol.pfad .eintrag { border-top: 0 !important; }
ol.pfad .eintrag .t2 .kz2 { color: var(--akzent); }

/* ---------- Ergänzen ---------- */
.ergaenzen { margin-top: 26px; border-top: 1px solid var(--linie2); padding-top: 14px; display: flex; flex-direction: column; gap: 8px; }
.ergaenzen textarea { width: 100%; min-height: 84px; resize: vertical; border-radius: 12px; border: 1px solid var(--linie); background: var(--panel2);
  color: var(--ink); font: inherit; padding: 10px 12px; }
.ergaenzen textarea:focus { outline: none; border-color: var(--akzent); }
.ergaenzen .zeile { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 12.5px; color: var(--grau); }
.knopf { height: 32px; padding: 0 14px; border-radius: 99px; border: 0; background: var(--pille); color: var(--pille-text); font-weight: 500; font-size: 13px; }
.wartet { margin-top: 14px; font-size: 13px; color: var(--grau); display: flex; align-items: center; gap: 8px; }
.wartet i { width: 7px; height: 7px; border-radius: 50%; background: var(--ocker); display: inline-block; }


</style>
</head>
<body>
<canvas class="grund" id="grund" aria-hidden="true"></canvas>
<div class="app" id="app">
  <header class="kopf">
    <button type="button" class="marke" id="marke" aria-label="Zur Startseite">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.8l2.3 6.1 6.5.3-5.1 4 1.8 6.3L12 15.9l-5.5 3.6 1.8-6.3-5.1-4 6.5-.3z"/></svg>
      Persönliches Wiki
    </button>
    <div class="suche">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
      <input id="suchfeld" type="search" placeholder="Im Wiki suchen" autocomplete="off" aria-label="Im Wiki suchen">
      <kbd>/</kbd>
      <div class="treffer" id="treffer" hidden></div>
    </div>
  </header>

  <section class="himmel" id="band" aria-label="Sternenkarte">
    <div class="himmel-ort" id="himmelOrt"></div>
    <button type="button" class="himmel-knopf" id="rauszoomen" hidden>
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 4H4v5M15 4h5v5M9 20H4v-5M15 20h5v-5"/></svg>
      <span>Alles zeigen</span>
    </button>
  </section>
