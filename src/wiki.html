    if (nutzer && nutzer.id === u.id) { return; }
    /* Anderes Konto als das, dessen Wiki gerade gezeigt wird: frisch laden. */
    if (gestartet && bisher && bisher !== u.id) { window.location.reload(); return; }
    nutzer = u; bisher = u.id;
    if (gestartet) { k.ansicht = null; tor(); return; }
    laden();
  }
  function anmeldenZeigen() { k.ansicht = "anmelden"; tor(); }
  k.start = function () {
    if (!hatteSitzung) { anmeldenZeigen(); } else { k.ansicht = "laden"; tor(); }
    bibliothek().then(function (mod) {
      sb = mod.createClient(ziel.url, ziel.key, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, storageKey: "klar.anmeldung" } });
      k.bereit = true;
      sb.auth.onAuthStateChange(function (ereignis, sitzung) {
        /* Erst nach diesem Takt hat die Bibliothek die Anmeldung fertig übernommen. */
        if (sitzung && sitzung.user) { setTimeout(function () { verbunden(sitzung.user); }, 0); }
        else if (ereignis === "SIGNED_OUT") { nutzer = null; kopieWeg(); anmeldenZeigen(); }
      });
      return sb.auth.getSession();
    }).then(function (r) {
      var s = r && r.data && r.data.session;
      if (s && s.user) { verbunden(s.user); } else { kopieWeg(); anmeldenZeigen(); }
    }).catch(function () {
      if (hatteSitzung && ausKopie(null)) { return; }
      k.ansicht = "fehler"; k.meldung = "Keine Verbindung. Sobald du wieder online bist, geht es weiter."; tor();
      window.addEventListener("online", function nochmal() { window.removeEventListener("online", nochmal); if (!sb) { k.start(); } });
    });
  };
  k.anmelden = function (mail, pw) {
    if (!sb) { return; }
    k.arbeitet = true; k.meldung = ""; tor();
    sb.auth.signInWithPassword({ email: mail, password: pw }).then(function (r) {
      k.arbeitet = false;
      if (r.error) { throw r.error; }
      if (r.data && r.data.user) { verbunden(r.data.user); }
    }).catch(function (e) { k.arbeitet = false; k.meldung = fehlerText(e); tor(); });
  };

  /* ---------- Einmal-Übernahme ----------
     Gibt es noch kein wiki/aktuell, legt Lukas es einmal aus wissensbaum.json an.
     Danach ist dieser Weg weg. Geschrieben wird nur, wenn das Dokument dann immer noch fehlt. */
  function dateiPruefen(datei) {
    k.datei = null; k.meldung = "";
    var leser = new FileReader();
    leser.onload = function () {
      var baum = null;
      try { baum = lesen(JSON.parse(String(leser.result))); } catch (e) { baum = null; }
      if (!baum || typeof baum !== "object") { k.meldung = "Die Datei ist kein JSON."; }
      else if (!Array.isArray(baum.artikel)) { k.meldung = "Das ist kein Wiki: die Liste „artikel“ fehlt."; }
      else if (!(Number(baum.fassung) >= 11)) { k.meldung = "Das Wiki hat Fassung " + (baum.fassung == null ? "?" : baum.fassung) + ". Nötig ist Fassung 11 oder neuer."; }
      else { k.datei = baum; }
      tor();
    };
    leser.onerror = function () { k.meldung = "Die Datei ließ sich nicht lesen."; tor(); };
    leser.readAsText(datei);
  }
  function uebernehmen() {
    var baum = k.datei;
    if (!baum || !nutzer) { return; }
    k.arbeitet = true; k.meldung = ""; tor();
    wikiHolen().then(function (da) {
      if (da) { return; }
      var jetzt = new Date().toISOString();
      return sb.from(T).insert({ user_id: nutzer.id, sammlung: "wiki", id: "aktuell", geaendert: jetzt,
        daten: { baum: JSON.stringify(baum), aktualisiert: jetzt, fassung: Number(baum.fassung) } }).then(pruef);
    }).then(function () { k.arbeitet = false; laden(); },
      function (e) { k.arbeitet = false; k.meldung = fehlerText(e); tor(); });
  }
  function zahl(n, eins, viele) { return n + " " + (n === 1 ? eins : viele); }
  function datum(iso) { return iso ? String(iso).slice(0, 10).split("-").reverse().join(".") : ""; }

  /* ---------- Die Seite vor dem Wiki: Anmelden, Laden, Übernahme ----------
     Wird nicht bei jeder Meldung neu gebaut (sonst wäre Getipptes weg) – nur Text und Knöpfe. */
  var STERN = '<svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.8l2.3 6.1 6.5.3-5.1 4 1.8 6.3L12 15.9l-5.5 3.6 1.8-6.3-5.1-4 6.5-.3z"/></svg>';
  function tor() {
    var el = document.getElementById("tor");
    if (!k.ansicht) {
      document.documentElement.removeAttribute("data-tor");
      if (el) { el.remove(); }
      return;
    }
    document.documentElement.setAttribute("data-tor", "ja");
    if (!el || el.dataset.ansicht !== k.ansicht) {
      if (el) { el.remove(); }
      el = document.createElement("div");
      el.id = "tor"; el.dataset.ansicht = k.ansicht;
      var kopf = function (titel, text) { return '<div class="tor-kopf">' + STERN + "<h1>" + titel + "</h1>" + (text ? "<p>" + text + "</p>" : "") + "</div>"; };
      var inhalt = {
        anmelden: kopf("Persönliches Wiki", "Melde dich mit deinem Klar-Konto an.") +
          '<input class="eingabe" id="wmail" type="email" autocomplete="email" placeholder="E-Mail" aria-label="E-Mail">' +
          '<input class="eingabe" id="wpw" type="password" autocomplete="current-password" placeholder="Passwort" aria-label="Passwort">' +
          '<button type="button" class="tor-knopf" data-wtu="an">Anmelden</button>',
        laden: kopf("Persönliches Wiki", "Wird geladen …"),
        uebernahme: kopf("Wiki übernehmen", "In deinem Konto liegt noch kein Wiki. Wähle einmal <b>wissensbaum.json</b> aus dem Projektmanagement-Vault, Ordner „05 Wissensbaum“.") +
          '<label class="tor-datei"><input type="file" id="wdatei" accept=".json,application/json"><span>Datei wählen</span></label>' +
          '<div class="tor-pruefung" id="wpruefung" hidden></div>' +
          '<button type="button" class="tor-knopf" data-wtu="uebernehmen" disabled>Übernehmen</button>',
        kaputt: kopf("Das Wiki lässt sich nicht lesen", "Der Eintrag in der Datenbank hat nicht die erwartete Form. Der Sonntagslauf muss ihn neu schreiben."),
        fehler: kopf("Persönliches Wiki", "") + '<button type="button" class="tor-knopf" data-wtu="nochmal">Nochmal versuchen</button>'
      }[k.ansicht];
      el.innerHTML = '<form class="tor-karte" novalidate onsubmit="return false">' + inhalt + '<p class="tor-meldung" id="wmeldung" role="status"></p></form>';
      document.body.appendChild(el);
      var f = el.querySelector("#wmail");
      if (f) { f.focus(); }
    }
    var m = el.querySelector("#wmeldung");
    if (m) { m.textContent = k.ansicht === "anmelden" && !k.bereit && !k.meldung ? "Wird geladen …" : (k.meldung || ""); }
    var p = el.querySelector("#wpruefung");
    if (p) {
      var b = k.datei;
      p.hidden = !b;
      if (b) {
        p.textContent = "Fassung " + b.fassung + (b.aktualisiert ? " vom " + datum(b.aktualisiert) : "") + " · " +
          zahl(b.artikel.length, "Ablauf", "Abläufe") + " · " + zahl((b.wissen || []).length, "Fachwissen-Seite", "Fachwissen-Seiten") + " · " +
          zahl((b.werkzeuge || []).length, "Werkzeug", "Werkzeuge") + " · " + zahl((b.anlaesse || []).length, "Anlass", "Anlässe");
      }
    }
    Array.prototype.forEach.call(el.querySelectorAll("button[data-wtu]"), function (b) {
      b.disabled = (k.ansicht === "anmelden" && !k.bereit) || k.arbeitet || (b.dataset.wtu === "uebernehmen" && !k.datei);
    });
  }
  document.addEventListener("click", function (ev) {
    var b = ev.target && ev.target.closest ? ev.target.closest("button[data-wtu]") : null;
    if (!b) { return; }
    if (b.dataset.wtu === "nochmal") { if (sb && nutzer) { laden(); } else { window.location.reload(); } return; }
    if (b.dataset.wtu === "uebernehmen") { uebernehmen(); return; }
    var mail = (document.getElementById("wmail") || {}).value || "", pw = (document.getElementById("wpw") || {}).value || "";
    if (!mail.trim() || !pw) { k.meldung = "E-Mail und Passwort eintragen."; tor(); return; }
    k.anmelden(mail.trim(), pw);
  });
  document.addEventListener("keydown", function (ev) {
    if (ev.key === "Enter" && ev.target && ev.target.id === "wpw") { ev.preventDefault(); var b = document.querySelector('button[data-wtu="an"]'); if (b) { b.click(); } }
  });
  document.addEventListener("change", function (ev) {
    if (ev.target && ev.target.id === "wdatei" && ev.target.files && ev.target.files[0]) { dateiPruefen(ev.target.files[0]); }
  });
  k.start();
  return { gueltig: gueltig, lesen: lesen };
})();
</script>
