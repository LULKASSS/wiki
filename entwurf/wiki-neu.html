<title>Persönliches Wiki</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap">
<style>
/* Aufbau: Leiste (Mac links, Handy unten) · eine Sicht zur Zeit · Wege aus Stationen als durchgehendes Bild (Anlässe, Schritte) */
:root{
  --bg:#F5F4F8; --surface:#FFFFFF; --surface-2:#EEEDF3; --surface-3:#E4E2EC;
  --fg:#0E0D14; --fg-2:#45434F; --fg-3:#6E6B7A; --on-accent:#FFFFFF;
  --line:#E3E1EA; --line-2:#CFCCD9;
  --accent:#6A52A3; --accent-ink:#5A4391; --accent-soft:rgba(106,82,163,.11); --accent-line:rgba(106,82,163,.40);
  --neu:#6A52A3; --neu-soft:rgba(106,82,163,.16);
  --ok-ink:#1E7A4E;
  --glas:rgba(255,255,255,.78);
  --shadow:0 0 0 1px rgba(14,13,20,.03),0 1px 2px rgba(14,13,20,.04),0 12px 32px -12px rgba(14,13,20,.12);
  --sans:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:18px; --r-s:12px; --ease:cubic-bezier(.22,1,.36,1);
  --spring:linear(0,.039,.134,.258,.393,.524,.644,.748,.833,.901,.952,.989,1.013,1.028,1.036,1.038,1.037,1.034,1.029,1.024,1.019,1.014,1.01,1.007,1.004,1.002,1.001,1);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C0B10; --surface:#15141B; --surface-2:#1C1B23; --surface-3:#26242F;
  --fg:#EEEDF3; --fg-2:#BEBBCA; --fg-3:#8F8C9C; --on-accent:#0E0D14;
  --line:#25232D; --line-2:#35333F;
  --accent:#A994E8; --accent-ink:#C3B5F2; --accent-soft:rgba(169,148,232,.14); --accent-line:rgba(169,148,232,.46);
  --neu:#B7A5F0; --neu-soft:rgba(169,148,232,.18); --ok-ink:#3DB67A; --glas:rgba(21,20,27,.80);
  --shadow:0 0 0 1px rgba(255,255,255,.05),0 1px 2px rgba(0,0,0,.35),0 12px 32px -12px rgba(0,0,0,.6);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0C0B10; --surface:#15141B; --surface-2:#1C1B23; --surface-3:#26242F;
  --fg:#EEEDF3; --fg-2:#BEBBCA; --fg-3:#8F8C9C; --on-accent:#0E0D14;
  --line:#25232D; --line-2:#35333F;
  --accent:#A994E8; --accent-ink:#C3B5F2; --accent-soft:rgba(169,148,232,.14); --accent-line:rgba(169,148,232,.46);
  --neu:#B7A5F0; --neu-soft:rgba(169,148,232,.18); --ok-ink:#3DB67A; --glas:rgba(21,20,27,.80);
  --shadow:0 0 0 1px rgba(255,255,255,.05),0 1px 2px rgba(0,0,0,.35),0 12px 32px -12px rgba(0,0,0,.6);
  color-scheme:dark;
}

/* Grundlagen */
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 var(--sans);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
a{color:inherit}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.025em;text-wrap:balance}
p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.drueck{transition:transform .12s var(--ease)}
.drueck:active{transform:scale(.97)}

/* Rahmen */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.leiste{position:sticky;top:0;height:100vh;padding:28px 14px 20px;display:flex;flex-direction:column;gap:4px;border-right:1px solid var(--line)}
.leiste .suchknopf{display:flex;align-items:center;gap:10px;height:40px;padding:0 12px;margin-bottom:14px;border-radius:12px;background:var(--surface-2);color:var(--fg-3);font-size:14px}
.leiste .suchknopf kbd{margin-left:auto}
.nav{display:flex;align-items:center;gap:11px;height:38px;padding:0 12px;border-radius:10px;color:var(--fg-2);font-size:14.5px;font-weight:500;position:relative}
.nav svg{flex:none;opacity:.8}
.nav[aria-current="page"]{color:var(--fg);background:var(--surface)}
.nav[aria-current="page"]::before{content:"";position:absolute;left:-14px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.nav .zahl{margin-left:auto;font-size:12.5px;color:var(--fg-3);font-weight:400}
.leiste .fuss{margin-top:auto;padding:0 12px;font-size:12.5px;color:var(--fg-3)}
kbd{font:500 11.5px var(--sans);min-width:20px;height:20px;padding:0 5px;display:inline-grid;place-items:center;border-radius:6px;background:var(--surface);color:var(--fg-3);box-shadow:inset 0 0 0 1px var(--line)}
main{min-width:0;padding-block:40px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sicht{max-width:880px;margin:0 auto;padding-inline:24px}
.sicht.raus{opacity:0;transform:translateX(var(--weg,-14px));transition:opacity .17s var(--ease),transform .17s var(--ease)}
.sicht.rein{animation:rein .33s var(--spring) both}
@keyframes rein{from{opacity:0;transform:translateX(var(--her,18px))}to{opacity:1;transform:none}}
.unten{display:none}

/* Start */
.held{position:relative;padding:30px 0 6px;isolation:isolate}
.held::before{content:"";position:absolute;inset:-60px -40px -20px;z-index:-1;background:
  radial-gradient(38% 60% at 22% 40%,var(--accent-soft),transparent 70%),
  radial-gradient(30% 50% at 78% 30%,var(--neu-soft),transparent 70%);
  filter:blur(6px);animation:treiben 38s ease-in-out infinite alternate}
@keyframes treiben{from{transform:translate3d(-2%,0,0) scale(1)}to{transform:translate3d(3%,2%,0) scale(1.06)}}
.held h1{font-size:clamp(30px,5.2vw,46px);line-height:1.08}
.held h1 em{font-style:normal;color:var(--accent)}
.suchfeld{margin-top:22px;display:flex;align-items:center;gap:12px;width:100%;height:56px;padding:0 18px;border-radius:16px;background:var(--surface);box-shadow:var(--shadow);color:var(--fg-3);font-size:16px}
.suchfeld kbd{margin-left:auto}
.abschnitt{margin-top:38px}
.abschnitt>h2{font-size:15px;font-weight:600;letter-spacing:-.01em;color:var(--fg-2);margin-bottom:14px;display:flex;align-items:baseline;gap:8px}
.abschnitt>h2 .zahl{font-weight:400;color:var(--fg-3)}

/* Neu */
.neukarte{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:22px 22px 10px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 22px}
.neukarte .gross{font-size:44px;font-weight:600;letter-spacing:-.04em;line-height:1;color:var(--accent)}
.neukarte .wofuer{font-size:14px;color:var(--fg-2);align-self:end;padding-bottom:4px}
.neukarte .wofuer b{display:block;color:var(--fg);font-size:16px;font-weight:600}
.neuliste{grid-column:1/-1;margin:14px -10px 0;padding:0;list-style:none}
.neuliste li button{display:grid;grid-template-columns:30px minmax(0,1fr) auto;align-items:center;gap:10px;width:100%;padding:10px;border-radius:12px}
.neuliste li button:hover{background:var(--surface-2)}
.neuliste .ort{font-size:14.5px;font-weight:500;min-width:0}
.neuliste .ort small{display:block;font-weight:400;color:var(--fg-3);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.neuliste .icon{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-ink)}
.marke{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--neu-soft);color:var(--accent-ink);white-space:nowrap}
.marke.leise{background:var(--surface-2);color:var(--fg-3)}
.neufuss{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end;padding:6px 0 8px;border-top:1px solid var(--line);margin-top:4px}
.pille{height:34px;padding:0 14px;border-radius:999px;background:var(--surface-2);font-size:13.5px;font-weight:500;color:var(--fg-2)}
.pille.voll{background:var(--accent);color:var(--on-accent)}
.ruhig{font-size:14px;color:var(--fg-3)}

/* Linienplan: Anlass = Weg durch Abläufe */
.plan{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.linie{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:18px 18px 12px}
.linie h3{font-size:16px}
.linie p{font-size:13px;color:var(--fg-3);margin-top:2px}
.stationen{list-style:none;margin:14px 0 0;padding:0;position:relative}
.stationen svg.spur{position:absolute;left:0;top:0;width:22px;height:100%;overflow:visible;pointer-events:none}
.spur line{stroke:var(--accent-line);stroke-width:2;stroke-linecap:round}
.spur.zeichnen line{stroke-dasharray:var(--l);stroke-dashoffset:var(--l);animation:zieh 1.4s var(--ease) forwards;animation-delay:var(--v,0s)}
@keyframes zieh{to{stroke-dashoffset:0}}
.station button{display:flex;align-items:center;gap:12px;width:100%;padding:6px 6px 6px 0;border-radius:10px;font-size:14px;color:var(--fg-2);position:relative}
.station button:hover{color:var(--fg)}
.station .punkt{flex:none;width:22px;display:grid;place-items:center}
.station .punkt i{width:11px;height:11px;border-radius:50%;background:var(--surface);box-shadow:0 0 0 2px var(--accent);transition:transform .2s var(--spring)}
.station button:hover .punkt i{transform:scale(1.25)}
.station:first-child .punkt i,.station:last-child .punkt i{background:var(--accent)}
.zeichnen~* .punkt i,.spur.zeichnen~.station .punkt i{animation:auf .45s var(--spring) both;animation-delay:var(--v,0s)}
@keyframes auf{from{transform:scale(.2)}to{transform:none}}
.station .neupunkt{margin-left:auto;flex:none;width:7px;height:7px;border-radius:50%;background:var(--neu)}

/* Bereiche als Chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 14px 0 10px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow);font-size:14px;font-weight:500}
.chip svg{color:var(--accent)}
.chip .zahl{color:var(--fg-3);font-weight:400}

/* Listen */
.kopf h1{font-size:clamp(28px,4vw,36px)}
.kopf p{color:var(--fg-3);margin-top:4px}
.gruppe{margin-top:34px}
.gruppe>header{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.gruppe>header .icon{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-ink);flex:none}
.gruppe>header h2{font-size:18px}
.gruppe>header p{font-size:13px;color:var(--fg-3)}
.zeilen{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.zeile{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;align-items:center;width:100%;padding:14px 18px;border-top:1px solid var(--line)}
.zeile:first-child{border-top:0}
.zeile:hover{background:var(--surface-2)}
.zeile b{font-weight:600;font-size:15px}
.zeile small{grid-column:1;font-size:13px;color:var(--fg-3);display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.zeile .rechts{grid-row:1/3;grid-column:2;display:flex;align-items:center;gap:10px;color:var(--fg-3);font-size:12.5px}

/* Umschalter */
.umschalter{margin-top:20px;display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;position:relative;padding:4px;border-radius:999px;background:var(--surface-2)}
.umschalter button{position:relative;z-index:1;height:34px;padding:0 18px;border-radius:999px;font-size:14px;font-weight:500;color:var(--fg-3);text-align:center;transition:color .3s}
.umschalter button[aria-pressed="true"]{color:var(--fg)}
.umschalter .gleiter{position:absolute;top:4px;bottom:4px;left:4px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow);transition:transform .45s var(--spring),width .45s var(--spring)}

/* Artikel */
.zurueck{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--fg-3);height:32px;margin:-6px 0 14px}
.zurueck:hover{color:var(--fg)}
.augenbraue{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--accent-ink);font-weight:500}
.artikelkopf h1{font-size:clamp(28px,4.4vw,40px);line-height:1.1;margin-top:8px}
.artikelkopf .wann{font-size:17px;color:var(--fg-2);margin-top:10px;max-width:62ch}
.werkzeugzeile{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.werkzeugzeile button{height:30px;padding:0 12px;border-radius:999px;background:var(--surface-2);font-size:13px;color:var(--fg-2)}
.inhalt{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;margin:26px -24px 0;padding:10px 24px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.inhalt::-webkit-scrollbar{display:none}
.inhalt button{flex:none;height:32px;padding:0 13px;border-radius:999px;font-size:13.5px;color:var(--fg-3);background:transparent;transition:background .3s,color .3s;display:flex;align-items:center;gap:6px}
.inhalt button[aria-current="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.inhalt button .p{width:6px;height:6px;border-radius:50%;background:var(--neu)}
.teil{margin-top:30px;display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:10px 34px;scroll-margin-top:70px;border-radius:var(--r)}
.teil>header{grid-column:1/-1;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.teil>header .nr{font-size:13px;color:var(--fg-3);font-weight:500;min-width:16px}
.teil>header h2{font-size:21px}
.teil>header .intro{flex-basis:100%;padding-left:26px;color:var(--fg-3);font-size:14.5px}
.teil.istneu{animation:neuglanz 2.4s var(--ease) .3s both}
@keyframes neuglanz{0%{background:var(--neu-soft);box-shadow:0 0 0 12px var(--neu-soft)}100%{background:transparent;box-shadow:0 0 0 12px transparent}}
.weg{list-style:none;margin:6px 0 0;padding:0;counter-reset:s}
.weg li{position:relative;padding:8px 0 14px 46px;counter-increment:s}
.weg li::before{content:counter(s);position:absolute;left:4px;top:7px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12.5px;font-weight:600;color:var(--fg-3);background:var(--surface);box-shadow:0 0 0 1.5px var(--line-2);transition:color .4s,background .4s,box-shadow .4s}
.weg li::after{content:"";position:absolute;left:16.25px;top:36px;bottom:-6px;width:1.5px;background:linear-gradient(var(--accent) var(--f,0%),var(--line-2) var(--f,0%));transition:--f .6s}
.weg li:last-child::after{display:none}
.weg li.da::before{color:var(--on-accent);background:var(--accent);box-shadow:0 0 0 1.5px var(--accent)}
.weg li.da::after{--f:100%}
.weg li b{font-weight:600}
.notiz{align-self:start;position:sticky;top:76px;padding:16px 16px 6px;border-radius:14px;background:var(--surface-2);font-size:13.5px;color:var(--fg-2)}
.notiz h3{font-size:12.5px;font-weight:600;color:var(--fg-3);letter-spacing:.01em;margin-bottom:8px}
.notiz ul{margin:0;padding:0;list-style:none}
.notiz li{padding:0 0 10px 14px;position:relative}
.notiz li::before{content:"";position:absolute;left:0;top:.6em;width:5px;height:5px;border-radius:50%;background:var(--accent-line)}
.notiz.leer{background:none}
.verbunden{margin-top:44px;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.verbunden h2{grid-column:1/-1;font-size:15px;color:var(--fg-2);margin-top:8px}
.kachel{display:block;width:100%;padding:16px 18px;border-radius:16px;background:var(--surface);box-shadow:var(--shadow)}
.kachel span{display:block;font-size:12.5px;color:var(--accent-ink);font-weight:500}
.kachel b{display:block;font-size:15px;font-weight:600;margin-top:2px}
.kachel small{display:block;font-size:13px;color:var(--fg-3);margin-top:2px}
.herkunft{margin-top:34px;padding-top:16px;border-top:1px solid var(--line);font-size:13px;color:var(--fg-3);display:flex;flex-wrap:wrap;gap:4px 18px}
.punkte{margin:8px 0 0;padding:0;list-style:none}
.punkte li{position:relative;padding:6px 0 6px 22px}
.punkte li::before{content:"";position:absolute;left:4px;top:15px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.quelle{font-size:13px;color:var(--fg-3);margin-top:8px}
.gepr{color:var(--ok-ink)}

/* Suche */
.suche{position:fixed;inset:0;z-index:40;display:grid;place-items:start center;padding:12vh 16px 16px;background:color-mix(in srgb,var(--bg) 55%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);animation:ein .2s var(--ease)}
@keyframes ein{from{opacity:0}}
.suchbox{width:min(640px,100%);max-height:72vh;display:flex;flex-direction:column;border-radius:20px;background:var(--surface);box-shadow:var(--shadow),0 30px 80px -20px rgba(14,13,20,.35);overflow:hidden;animation:hoch .33s var(--spring)}
@keyframes hoch{from{transform:translateY(14px) scale(.98);opacity:0}}
.suchbox label{display:flex;align-items:center;gap:12px;padding:0 18px;height:60px;border-bottom:1px solid var(--line)}
.suchbox input{flex:1;min-width:0;border:0;outline:0;background:none;font:16px var(--sans);color:var(--fg)}
.suchbox input::placeholder{color:var(--fg-3)}
.suchbox input::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}
.treffer{overflow:auto;padding:8px;overscroll-behavior:contain}
.treffer h3{font-size:12.5px;color:var(--fg-3);font-weight:600;padding:10px 10px 4px}
.treffer button{display:block;width:100%;padding:9px 10px;border-radius:10px;animation:auf2 .3s var(--spring) both;animation-delay:var(--v,0s)}
@keyframes auf2{from{opacity:0;transform:translateY(4px)}}
.treffer button[aria-selected="true"],.treffer button:hover{background:var(--surface-2)}
.treffer b{display:block;font-size:14.5px;font-weight:500}
.treffer small{display:block;font-size:13px;color:var(--fg-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.treffer mark{background:var(--neu-soft);color:inherit;border-radius:3px}
.treffer .nix{padding:26px 10px;text-align:center;color:var(--fg-3)}

/* Handy */
@media (max-width:860px){
  .app{display:block}
  .leiste{display:none}
  main{padding-block:22px 110px}
  .sicht{padding-inline:0}
  .unten{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;z-index:20;left:0;right:0;bottom:0;padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));background:var(--glas);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border-top:1px solid var(--line)}
  .unten button{display:grid;justify-items:center;gap:2px;padding:6px 0 4px;font-size:11px;font-weight:500;color:var(--fg-3);text-align:center;border-radius:12px}
  .unten button[aria-current="page"]{color:var(--accent-ink)}
  .held{padding:14px 0 0}
  .suchfeld{height:52px}
  .suchfeld kbd,.leiste kbd,.suchbox kbd{display:none}
  .neukarte{padding:18px 16px 8px;gap:2px 16px}
  .neukarte .gross{font-size:38px}
  .plan{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:78%;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:2px 16px 14px;scrollbar-width:none}
  .plan::-webkit-scrollbar{display:none}
  .linie{scroll-snap-align:start}
  .zeile{grid-template-columns:minmax(0,1fr);padding:13px 16px}
  .zeile small{-webkit-line-clamp:2}
  .zeile .rechts{grid-row:auto;grid-column:1;margin-top:4px}
  .zeile .rechts svg{display:none}
  .inhalt{margin-inline:-16px;padding-inline:16px}
  .teil{grid-template-columns:minmax(0,1fr);gap:6px}
  .notiz{position:static;margin-left:46px}
  .notiz.leer{display:none}
  .weg li{padding-left:42px}
  .suche{padding:0;place-items:end stretch}
  .suchbox{width:100%;max-height:86vh;border-radius:22px 22px 0 0;padding-bottom:env(safe-area-inset-bottom,0px);animation:hochhandy .38s var(--spring)}

    var w = WZ[S.id];
    var h = kopf(zeichen("werkzeug", 16) + "Werkzeug" + (neuAn("werkzeuge", w.id) ? ' <span class="marke">neu</span>' : ""), w.name, w.kurz);
    h += '<section class="teil"><div><ul class="punkte">' + w.punkte.map(function (p) { return '<li>' + fett(p) + '</li>'; }).join("") + '</ul><p class="quelle">' + esc(w.quelle) + (w.geprueft ? ' · <span class="gepr">geprüft ' + datum(w.geprueft) + '</span>' : "") + '</p></div><aside class="notiz leer"></aside></section>';
    var wo = D.artikel.filter(function (a) { return (a.werkzeuge || []).indexOf(w.id) >= 0; });
    if (wo.length) { h += '<section class="verbunden"><h2>Kommt vor in</h2>' + wo.map(function (a) { return '<button class="kachel drueck" data-artikel="' + a.id + '" type="button"><span>' + esc((KAT[a.kategorie] || {}).name) + '</span><b>' + esc(a.name) + '</b></button>'; }).join("") + '</section>'; }
    return h;
  }

  function render() {
    var el = $("sicht");
    el.innerHTML = { start: startSicht, ablaeufe: ablaeufeSicht, wissen: wissenSicht, artikel: artikelSicht, fach: fachSicht, werkzeug: werkzeugSicht }[S.sicht]();
    var haupt = S.sicht === "artikel" ? "ablaeufe" : (S.sicht === "fach" || S.sicht === "werkzeug") ? "wissen" : S.sicht;
    document.querySelectorAll("[data-ziel]").forEach(function (b) { if (b.getAttribute("data-ziel") === haupt) { b.setAttribute("aria-current", "page"); } else { b.removeAttribute("aria-current"); } });
    if (S.sicht === "start") { linienZeichnen(!S.zuerst.start); S.zuerst.start = true; }
    if (S.sicht === "wissen") { gleiter(); }
    if (S.sicht === "artikel" || S.sicht === "fach") { wegBeobachten(); }
  }

  /* Linienplan: die Spur zeichnet sich beim ersten Besuch, danach steht sie */
  function linienZeichnen(animiert) {
    document.querySelectorAll(".stationen").forEach(function (ol) {
      var punkte = ol.querySelectorAll(".punkt");
      if (punkte.length < 2) { return; }
      var oben = ol.getBoundingClientRect().top;
      var y1 = punkte[0].getBoundingClientRect().top - oben + punkte[0].offsetHeight / 2;
      var y2 = punkte[punkte.length - 1].getBoundingClientRect().top - oben + punkte[0].offsetHeight / 2;
      var l = Math.max(1, y2 - y1);
      ol.insertAdjacentHTML("afterbegin", '<svg class="spur' + (animiert ? " zeichnen" : "") + '" style="--l:' + l + ';--v:' + ol.getAttribute("data-v") + 's" aria-hidden="true"><line x1="11" x2="11" y1="' + y1 + '" y2="' + y2 + '"/></svg>');
      if (!animiert) { ol.querySelectorAll(".punkt i").forEach(function (i) { i.style.animation = "none"; }); }
    });
  }
  function gleiter() {
    var g = document.querySelector(".gleiter"), b = document.querySelector('.umschalter [aria-pressed="true"]');
    if (g && b) { g.style.width = b.offsetWidth + "px"; g.style.transform = "translateX(" + (b.offsetLeft - 4) + "px)"; }
  }
  /* Schritte füllen sich beim Lesen, der Abschnitt im Blick ist oben markiert */
  var beob = null;
  function wegBeobachten() {
    if (beob) { beob.disconnect(); }
    if (!("IntersectionObserver" in window)) { return; }
    beob = new IntersectionObserver(function (es) {
      es.forEach(function (e) {
        if (e.isIntersecting && e.target.tagName === "LI") { e.target.classList.add("da"); }
        if (e.target.classList.contains("teil") && e.isIntersecting) {
          var i = e.target.id.split("-")[1];
          document.querySelectorAll(".inhalt button").forEach(function (b) { b.setAttribute("aria-current", String(b.getAttribute("data-spring") === i)); });
          var akt = document.querySelector('.inhalt [aria-current="true"]');
          if (akt && akt.scrollIntoView) { akt.parentNode.scrollTo({ left: akt.offsetLeft - 24, behavior: "smooth" }); }
        }
      });
    }, { rootMargin: "-20% 0px -55% 0px" });
    document.querySelectorAll(".weg li, .teil").forEach(function (x) { beob.observe(x); });
  }

  /* Suche */
  var Q = [];
  D.artikel.forEach(function (a) {
    Q.push({ art: "Abläufe", ziel: 'data-artikel="' + a.id + '"', titel: a.name, unter: a.wann, text: a.name + " " + a.wann });
    a.abschnitte.forEach(function (t, i) {
      (t.schritte || []).concat(t.hinweise || []).forEach(function (s) { Q.push({ art: "In den Schritten", ziel: 'data-artikel="' + a.id + '" data-teil="' + i + '"', titel: a.name + (t.titel ? " · " + t.titel : ""), unter: s, text: s, tief: true }); });
    });
  });
  D.wissen.forEach(function (w) {
    Q.push({ art: "Fachwissen", ziel: 'data-fach="' + w.id + '"', titel: w.name, unter: w.kurz, text: w.name + " " + w.kurz });
    w.abschnitte.forEach(function (t, i) { t.punkte.forEach(function (p) { Q.push({ art: "In den Schritten", ziel: 'data-fach="' + w.id + '" data-teil="' + i + '"', titel: w.name + (t.titel ? " · " + t.titel : ""), unter: p, text: p, tief: true }); }); });
  });
  D.werkzeuge.forEach(function (w) { Q.push({ art: "Werkzeuge", ziel: 'data-werkzeug="' + w.id + '"', titel: w.name, unter: w.kurz, text: w.name + " " + w.kurz + " " + w.punkte.join(" ") }); });
  var norm = function (s) { return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, ""); };
  function markieren(t, worte) {
    var e = esc(t);
    worte.forEach(function (w) { if (w.length > 1) { e = e.replace(new RegExp("(" + w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "ig"), "<mark>$1</mark>"); } });
    return e;
  }
  function sucheOeffnen() {
    if ($("suche")) { return; }
    document.body.insertAdjacentHTML("beforeend", '<div class="suche" id="suche" role="dialog" aria-modal="true" aria-label="Suchen"><div class="suchbox"><label>' + zeichen("lupe") +
      '<input id="suchein" type="search" autocomplete="off" placeholder="Wie machst du das nochmal?" enterkeyhint="go"><kbd>Esc</kbd></label><div class="treffer" id="treffer"></div></div></div>');
    var ein = $("suchein");
    ein.addEventListener("input", suchen);
    ein.addEventListener("keydown", function (e) {
      var alle = [].slice.call(document.querySelectorAll("#treffer button")), i = alle.findIndex(function (b) { return b.getAttribute("aria-selected") === "true"; });
      if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); if (alle.length) { if (i >= 0) { alle[i].removeAttribute("aria-selected"); } i = (i + (e.key === "ArrowDown" ? 1 : -1) + alle.length) % alle.length; alle[i].setAttribute("aria-selected", "true"); alle[i].scrollIntoView({ block: "nearest" }); } }
      if (e.key === "Enter" && alle.length) { e.preventDefault(); (alle[i] || alle[0]).click(); }
    });
    $("suche").addEventListener("click", function (e) { if (e.target.id === "suche") { sucheZu(); } });
    suchen(); setTimeout(function () { ein.focus(); }, 30);
  }
  function sucheZu() { var s = $("suche"); if (s) { s.remove(); } }
  function suchen() {
    var q = norm($("suchein").value.trim()), worte = q.split(/\s+/).filter(Boolean), aus = $("treffer");
    if (!worte.length) {
      aus.innerHTML = '<h3>Häufig gebraucht</h3>' + D.anlaesse.slice(0, 5).map(function (an, i) { var id = an.weg[0]; return ART[id] ? '<button style="--v:' + i * 0.03 + 's" data-artikel="' + id + '" type="button"><b>' + esc(an.name) + '</b><small>' + esc(ART[id].name) + '</small></button>' : ""; }).join("");
      return;
    }
    var gruppen = {};
    Q.forEach(function (x) {
      var t = norm(x.text);
      if (worte.every(function (w) { return t.indexOf(w) >= 0; })) { (gruppen[x.art] = gruppen[x.art] || []).push(x); }
    });
    var reihe = ["Abläufe", "Fachwissen", "Werkzeuge", "In den Schritten"], n = 0;
    var html = reihe.filter(function (g) { return gruppen[g]; }).map(function (g) {
      return '<h3>' + g + '</h3>' + gruppen[g].slice(0, g === "In den Schritten" ? 8 : 6).map(function (x) {
        return '<button style="--v:' + (n++ * 0.025).toFixed(3) + 's" ' + x.ziel + ' type="button"><b>' + (x.tief ? esc(x.titel) : markieren(x.titel, worte)) + '</b><small>' + markieren(x.unter || "", worte) + '</small></button>';
      }).join("");
    }).join("");
    aus.innerHTML = html || '<p class="nix">Dazu steht noch nichts im Wiki.</p>';
  }

  /* Bedienung */
  document.addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) { return; }
    var teil = b.hasAttribute("data-teil") ? Number(b.getAttribute("data-teil")) : null;
    if (b.closest("#suche")) { sucheZu(); }
    if (b.hasAttribute("data-ziel")) { verlauf = []; go(b.getAttribute("data-ziel")); }
    else if (b.hasAttribute("data-artikel")) { go("artikel", b.getAttribute("data-artikel"), teil); }
    else if (b.hasAttribute("data-fach")) { go("fach", b.getAttribute("data-fach"), teil); }
    else if (b.hasAttribute("data-werkzeug")) { go("werkzeug", b.getAttribute("data-werkzeug")); }
    else if (b.hasAttribute("data-kategorie")) { var k = b.getAttribute("data-kategorie"); go("ablaeufe"); setTimeout(function () { var z = $("kat-" + k); if (z) { z.scrollIntoView({ behavior: "smooth", block: "start" }); } }, 260); }
    else if (b.hasAttribute("data-reiter")) { S.wissenReiter = b.getAttribute("data-reiter"); document.querySelectorAll("[data-reiter]").forEach(function (x) { x.setAttribute("aria-pressed", String(x === b)); }); gleiter(); setTimeout(function () { var y = scrollY; render(); scrollTo(0, y); }, 200); }
    else if (b.hasAttribute("data-spring")) { var z = $("teil-" + b.getAttribute("data-spring")); if (z) { z.scrollIntoView({ behavior: "smooth", block: "start" }); } }
    else if (b.getAttribute("data-aktion") === "suchen") { sucheOeffnen(); }
    else if (b.getAttribute("data-aktion") === "zurueck") { zurueck(); }
    else if (b.getAttribute("data-aktion") === "alleneu") { var ul = document.querySelector(".neuliste"); ul.innerHTML = NEUG.map(neuZeile).join(""); b.remove(); }
    else if (b.getAttribute("data-aktion") === "gesehen") {
      try { localStorage.setItem("wiki.gesehen", JSON.stringify(JETZT)); } catch (x) {}
      NEU = []; NEUG = []; var karte = b.closest(".abschnitt");
      karte.style.transition = "opacity .25s, transform .33s var(--spring)"; karte.style.opacity = "0"; karte.style.transform = "translateY(-6px)";
      setTimeout(function () { var y = scrollY; render(); scrollTo(0, y); }, 260);
    }
  });
  document.addEventListener("keydown", function (e) {
    var tippt = /INPUT|TEXTAREA/.test((e.target || {}).tagName || "");
    if ((e.key === "/" && !tippt) || (e.key === "k" && (e.metaKey || e.ctrlKey))) { e.preventDefault(); sucheOeffnen(); }
    if (e.key === "Escape") { sucheZu(); }
  });
  addEventListener("resize", function () { if (S.sicht === "wissen") { gleiter(); } });

  $("zA").textContent = D.artikel.length;
  $("zW").textContent = D.wissen.length + D.werkzeuge.length;
  $("fuss").textContent = "Fassung " + D.fassung + " · Stand " + datum(D.aktualisiert);
  var m = /^#\/(\w+)(?:\/([\w-]+))?/.exec(location.hash);
  if (m && ({ artikel: ART, fach: WIS, werkzeug: WZ }[m[1]] || {})[m[2]]) { S.sicht = m[1]; S.id = m[2]; }
  else if (m && REIHE[m[1]] !== undefined && !m[2]) { S.sicht = m[1]; }
  render();
})();
</script>
